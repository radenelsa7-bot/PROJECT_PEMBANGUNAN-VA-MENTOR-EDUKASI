version: "3.8"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:///./vame.db"
      AI_PROVIDER: "mock"
      AUTO_SEED: "1"
    volumes:
      - ./backend/vame.db:/app/vame.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE: "http://localhost:8000/api/v1"
